const scene=new T.Scene();scene.background=new T.Color(0x294b38);const r=new T.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,1.5));r.shadowMap.enabled=true;document.body.prepend(r.domElement);const cam=new T.OrthographicCamera();function resize(){let a=innerWidth/innerHeight;Object.assign(cam,{left:-10*a,right:10*a,top:10,bottom:-10,near:.1,far:100});cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)}resize();window.onresize=resize;scene.add(new T.HemisphereLight(0xfff5d8,0x52684c,2));let sun=new T.DirectionalLight(0xffedce,2.4);sun.position.set(-8,16,9);sun.castShadow=true;Object.assign(sun.shadow.camera,{left:-20,right:20,top:20,bottom:-20});sun.shadow.mapSize.set(1024,1024);scene.add(sun);function mesh(g,c,x,y,z,p=scene){let m=new T.Mesh(g,new T.MeshStandardMaterial({color:c}));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;p.add(m);return m}const box=(w,h,d,c,x,y,z,p)=>mesh(new T.BoxGeometry(w,h,d),c,x,y,z,p);box(28,.4,22,0x789b51,0,-.2,0);for(let i=0;i<12;i++)for(let j=0;j<9;j++)box(2.3,.02,2.3,(i+j)%2?0x7da256:0x83a95b,i*2.3-12.65,.01,j*2.3-9.2);let walls=[];for(let [x,z] of [[-5,-3],[5,3],[-7,4],[7,-4],[0,-6]]){box(2,1.5,2,0x9a6940,x,.75,z);box(2.1,.15,2.1,0xc28b50,x,1.5,z);walls.push([x,z])}for(let i=0;i<24;i++){let x=i<12?-13:13,z=(i%12)*1.8-10;mesh(new T.CylinderGeometry(.23,.35,2),0x795333,x,1,z);mesh(new T.IcosahedronGeometry(1.2,1),0x286b3c,x,2.6,z)}function actor(c,x,z){let g=new T.Group();scene.add(g);g.position.set(x,0,z);let legs=[box(.3,.65,.35,0x202b35,-.23,.34,0,g),box(.3,.65,.35,0x202b35,.23,.34,0,g)];box(.85,.8,.55,c,0,1,0,g);mesh(new T.SphereGeometry(.48,16,12),0xe9b68b,0,1.75,0,g);box(.85,.25,.65,0x28242a,0,2.05,-.05,g);for(let a of [-.2,.2])box(.23,.15,.06,0x202020,a,1.8,.44,g);let arm=box(.27,.7,.3,c,.62,1,.1,g);return {g,legs,arm,hp:3}}function donggi(){let g=new T.Group();scene.add(g);const b=(w,h,d,c,x,y,z,p=g)=>box(w,h,d,c,x,y,z,p);const s=(r,c,x,y,z,sx=1,sy=1,sz=1,p=g)=>{let m=mesh(new T.SphereGeometry(r,16,12),c,x,y,z,p);m.scale.set(sx,sy,sz);return m};let navy=0x253047,skin=0xe8b58e;let legs=[new T.Group(),new T.Group()];legs.forEach((l,i)=>{l.position.set(i? .24:-.24,.72,0);g.add(l);b(.34,.65,.38,navy,0,-.28,0,l);s(.24,0x151923,0,-.58,.12, .85,.55,1.35,l)});s(.65,navy,0,1.16,0,.85,.83,.57);b(.35,.68,.08,0xf5f5ef,0,1.19,.34);b(.12,.52,.09,0x9c3039,0,1.19,.4);for(let k of [-1,1]){let lap=b(.16,.53,.09,0x39465c,k*.22,1.3,.34);lap.rotation.z=k*.38} s(.58,skin,0,1.98,0,1,1.03,.88);s(.59,0x242129,0,2.24,-.09,1.03,.64,.9);for(let k of [-1,1]){s(.14,skin,k*.55,1.98,0);b(.43,.29,.09,0x171a21,k*.26,2.02,.46);b(.33,.20,.04,0xc3d4df,k*.26,2.02,.515);s(.065,0x22252b,k*.26,2.02,.55);b(.26,.055,.06,0x30262a,k*.26,2.24,.43)}b(.15,.065,.07,0x171a21,0,2.03,.5);s(.09,skin,0,1.92,.51);b(.19,.035,.035,0x7c4437,0,1.76,.47);let arms=[new T.Group(),new T.Group()];arms.forEach((a,i)=>{a.position.set(i?.53:-.53,1.44,.04);g.add(a);b(.31,.43,.34,navy,0,-.15,0,a);b(.31,.3,.36,navy,0,-.32,.23,a);b(.32,.12,.15,0xf5f5ef,0,-.32,.43,a);s(.22,skin,0,-.31,.56,1,1,.95,a)});return {g,legs,arm:arms[1],otherArm:arms[0],hp:3}}let p=donggi(), enemies=[],hp=100,kills=0,cd=0,dc=0,inv=0,spawn=0,keys={},v={x:0,z:0},hold=false,dead=false;for(let i=0;i<6;i++)add();function add(){let a=Math.random()*6.28;enemies.push(actor(0xa43b35,Math.cos(a)*10,Math.sin(a)*8))}function move(o,x,z){let nx=T.MathUtils.clamp(o.position.x+x,-12,12),nz=T.MathUtils.clamp(o.position.z+z,-10,10);if(!walls.some(([a,b])=>Math.abs(nx-a)<1.45&&Math.abs(o.position.z-b)<1.45))o.position.x=nx;if(!walls.some(([a,b])=>Math.abs(o.position.x-a)<1.45&&Math.abs(nz-b)<1.45))o.position.z=nz}let joy=document.querySelector('#joy'),knob=document.querySelector('#knob');function stick(e){let b=joy.getBoundingClientRect(),x=e.clientX-b.left-50,z=e.clientY-b.top-50,l=Math.max(40,Math.hypot(x,z));v={x:x/l,z:z/l};knob.style.transform=`translate(${v.x*35}px,${v.z*35}px)`}joy.onpointerdown=e=>{joy.setPointerCapture(e.pointerId);stick(e)};joy.onpointermove=e=>{if(joy.hasPointerCapture(e.pointerId))stick(e)};joy.onpointerup=joy.onpointercancel=()=>{v={x:0,z:0};knob.style.transform=''};window.onkeydown=e=>keys[e.code]=true;window.onkeyup=e=>keys[e.code]=false;let atk=document.querySelector('#atk');atk.onpointerdown=e=>{atk.setPointerCapture(e.pointerId);hold=true};atk.onpointerup=atk.onpointercancel=()=>hold=false;function dash(){if(dc<=0&&!dead){dc=2;inv=.3;move(p.g,Math.sin(p.g.rotation.y)*2.6,Math.cos(p.g.rotation.y)*2.6)}}document.querySelector('#dash').onpointerdown=dash;let fx=[];function attack(){cd=.45;let ring=mesh(new T.RingGeometry(.8,2.1,32),0xffd15a,p.g.position.x,.08,p.g.position.z);ring.rotation.x=-Math.PI/2;ring.material.transparent=true;fx.push({ring,t:.22});for(let e of enemies)if(e.g.position.distanceTo(p.g.position)<2.5)e.hp--;for(let e of enemies.filter(e=>e.hp<=0)){scene.remove(e.g);kills++}enemies=enemies.filter(e=>e.hp>0)}let clock=new T.Clock(),time=0;document.querySelector('#msg').textContent='';function loop(){requestAnimationFrame(loop);let dt=Math.min(clock.getDelta(),.05);time+=dt;if(!dead){cd-=dt;dc-=dt;inv-=dt;let x=v.x+(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),z=v.z+(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0),l=Math.hypot(x,z);if(l>.05){p.g.rotation.y=Math.atan2(x,z);move(p.g,x/Math.max(1,l)*5*dt,z/Math.max(1,l)*5*dt)}p.legs.forEach((a,i)=>a.rotation.x=l>.05?Math.sin(time*13+i*Math.PI)*.6:0);if((hold||keys.Space)&&cd<=0)attack();if(keys.ShiftLeft)dash();p.arm.rotation.x=cd>0?-Math.sin(cd/.45*Math.PI)*1.45:Math.sin(time*13)*Math.min(l,1)*.2;p.otherArm.rotation.x=cd>0?Math.sin(cd/.45*Math.PI)*.35:-Math.sin(time*13)*Math.min(l,1)*.2;p.g.rotation.z=cd>0?Math.sin(cd/.45*Math.PI)*.12:0;for(let e of enemies){let d=p.g.position.clone().sub(e.g.position),len=d.length();e.g.rotation.y=Math.atan2(d.x,d.z);if(len>1){move(e.g,d.x/len*1.8*dt,d.z/len*1.8*dt);e.legs.forEach((a,i)=>a.rotation.x=Math.sin(time*10+i*Math.PI)*.5)}else if(inv<=0){hp-=8;inv=.6}}spawn+=dt;if(spawn>3&&enemies.length<12){add();spawn=0}if(hp<=0){dead=true;document.querySelector('#msg').textContent='전투 종료 · 처치 '+kills+'명'}}for(let f of fx){f.t-=dt;f.ring.material.opacity=Math.max(0,f.t/.22);if(f.t<=0){scene.remove(f.ring);f.ring.geometry.dispose();f.ring.material.dispose()}}fx=fx.filter(f=>f.t>0);document.querySelector('#stats').textContent=`HP ${Math.max(0,hp)}  |  처치 ${kills}  |  대시 ${Math.max(0,dc).toFixed(1)}s`;cam.position.set(p.g.position.x,20,p.g.position.z+14);cam.lookAt(p.g.position.x,0,p.g.position.z);r.render(scene,cam)}loop();}catch(e){fail(e)}})();</script></html>
