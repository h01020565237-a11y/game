": [823, 269], "bgm": "play", "hideSourceTimecode": true}, {"duration": 2, "sfx": [[0, "impact"]], "voice": [[0.2, "giseop", "웃기냐?"]], "motion": "shake", "unlock": false, "image": "scenes/giseop/04.webp", "size": [822, 269], "bgm": "stop", "hideSourceTimecode": true}, {"duration": 3, "sfx": [[0.1, "huff"]], "voice": [[0.2, "hyeongon", "캬하하하!"]], "motion": "still", "unlock": false, "image": "scenes/giseop/05.webp", "size": [823, 293], "bgm": "stop", "hideSourceTimecode": true}, {"duration": 3, "sfx": [[0, "fanfare"]], "voice": [], "motion": "still", "unlock": true, "image": "scenes/giseop/06.webp", "size": [822, 293], "bgm": "stop", "hideSourceTimecode": true}], "duration": 20}, "sanghun": {"name": "상훈", "title": "섬 사건", "scenes": [{"duration": 4, "sfx": [[0, "car"]], "voice": [], "motion": "pan", "unlock": false, "image": "scenes/sanghun/01.webp", "size": [823, 287], "bgm": "play", "hideSourceTimecode": true}, {"duration": 4, "sfx": [[0, "car"]], "voice": [[0.4, "sanghun", "어! 저기 바다에 땅이 떠 있다!"]], "motion": "pan", "unlock": false, "image": "scenes/sanghun/02.webp", "size": [823, 269], "bgm": "play", "hideSourceTimecode": true}, {"duration": 4, "sfx": [[0, "pop"]], "voice": [[0.3, "giseop", "저게 섬이라는 거야!!"]], "motion": "zoom", "unlock": false, "image": "scenes/sanghun/03.webp", "size": [822, 269], "bgm": "stop", "hideSourceTimecode": true}, {"duration": 3, "sfx": [[0.2, "ding"]], "voice": [], "motion": "zoom", "unlock": false, "image": "scenes/sanghun/04.webp", "size": [823, 293], "bgm": "stop", "hideSourceTimecode": true}, {"duration": 3, "sfx": [[0, "fanfare"]], "voice": [], "motion": "still", "unlock": true, "image": "scenes/sanghun/05.webp", "size": [822, 293], "bgm": "stop", "hideSourceTimecode": true}], "duration": 18}, "gyeongsu": {"name": "경수", "title": "커플룩 사건", "scenes": [{"duration": 4, "sfx": [[0, "street"], [0.5, "steps"]], "voice": [], "motion": "pan", "unlock": false, "image": "scenes/gyeongsu/01.webp", "size": [712, 285], "bgm": "play", "hideSourceTimec ength)return;let u=new SpeechSynthesisUtterance(txt),v=M.voices[id];u.lang='ko-KR';u.voice=list[0];u.pitch=v.pitch;u.rate=v.rate;u.volume=Number($('vv').value);speechSynthesis.speak(u)}function start(key){clear();const token=run,story=M.stories[key];let elapsed=0;story.scenes.forEach(s=>{const im=new Image();im.src=s.image});function next(i){if(token!==run)return;if(i>=story.scenes.length){clear();$('status').textContent=story.name+' · 영입 컷신 재생 완료 (미리보기)';$('bar').style.width='100%';return}const s=story.scenes[i];active.forEach(a=>a.pause());active=[];window.speechSynthesis?.cancel();pic.getAnimations().forEach(a=>a.cancel());pic.src=s.image;cover.style.display='none';$('status').textContent=story.name+' · '+story.title+'  |  '+(i+1)+' / '+story.scenes.length;bgm.volume=Number($('bv').value);if(s.bgm==='play'){if(bgm.paused)bgm.play().catch(()=>{})}else bgm.pause();const motion=s.motion;pic.animate(motion==='shake'?[{transform:'translateX(0)'},{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'translateX(0)'}]:[{opacity:.8},{opacity:1}],{duration:motion==='shake'?250:180});s.sfx.forEach(([at,id])=>later(()=>sound(id),at*1000));s.voice.forEach(([at,id,txt])=>later(()=>speak(id,txt),at*1000));$('bar').getAnimations().forEach(a=>a.cancel());$('bar').style.width=100*elapsed/story.duration+'%';$('bar').animate([{width:100*elapsed/story.duration+'%'},{width:100*(elapsed+s.duration)/story.duration+'%'}],{duration:s.duration*1000,fill:'forwards'});elapsed+=s.duration;later(()=>next(i+1),s.duration*1000)}next(0)}for(const [k,s] of Object.entries(M.stories)){let b=document.createElement('button');b.textContent=s.name+' · '+s.title;b.onclick=()=>start(k);$('menu').append(b)}$('skip').onclick=()=>{clear();$('status').textContent='재생 건너뜀 (실제 영입 저장은 게임에서 처리)'};$('full').onclick=()=>$('stage').requestFullscreen?.();$('bv').oninput=()=>bgm.volume=Number($('bv').value);if(window.speechSynthesis){speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{i
