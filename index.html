<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Battle Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
  <link rel="stylesheet" href="css/game.css">
  <link rel="stylesheet" href="css/ui.css">
</head>
<body class="lobbyOpen">
  <div id="rotateHint">휴대폰을 가로로 돌려 주세요 ↻</div>
  <h2>Battle Lab</h2>
  <div id="menuPanel">
  <div id="help">WASD 이동 · Space 대시 · 좌클릭 공격 · 아이템 자동 획득 · F 무기 교체 · G/우클릭 수류탄 · Esc 캐릭터 선택 · Q 소환 · E 포켓몬 교체 · 1~3 포켓몬 선택 · R 재시작</div>
  <div>
    <label>캐릭터
      <select id="character">
        <option value="summoner">현곤 · 소환사</option>
        <option value="bear">정용 · 생존형</option>
        <option value="runner">기섭 · 기동형</option>
        <option value="suit">동기</option>
        <option value="octo">상훈</option>
        <option value="stripe">경수</option>
        <option value="soccer">재한</option>
        <option value="support">은숙</option>
      </select>
    </label>
    <button id="charApply">선택 및 시작</button>
  </div>
  <div id="deckUI"></div>
  <button id="mobileToggle">터치 조작 전환</button>
  </div>
  <div id="hud"></div>
  <div id="arena">
    <canvas id="c" width="1000" height="650"></canvas>
    <div id="touch">
      <div class="stick" id="mv"><i></i><span>이동</span></div>
      <button id="atk">공격</button>
      <button id="dashBtn">대시</button>
      <button id="summonBtn">소환</button>
      <button id="bearHeal" style="display:none;right:20%;bottom:36%">회복</button>
      <button id="pickBtn">교체</button>
      <button id="grenBtn">수류탄</button>
      <button id="menuBtn" aria-label="메뉴">메뉴</button>
      <div id="summonMenu" aria-hidden="true"></div>
    </div>
    <!-- 전투 HUD -->
    <div id="topHud">
      <div class="pill" id="aliveHud">생존 <b id="aliveNum">8</b><small>/8</small></div>
      <div class="pill timer" id="timeHud">0:00</div>
      <div class="pill zone" id="zoneHud">자기장 25초 후</div>
    </div>
    <div id="weaponHud">
      <span id="weaponIcon" aria-hidden="true"></span>
      <span class="wtext"><b id="weaponName">맨손</b><span id="ammoPips">●●●</span></span>
      <span id="grenHud">수류탄 0/3</span>
      <span id="gearHud" hidden></span>
    </div>

    <!-- 로비 (캐릭터 선택) -->
    <section id="lobby" class="screen" aria-label="캐릭터 선택">
      <div class="panel lobby-card">
        <div class="lobby-grid" id="charGrid"></div>
        <div class="lobby-info">
          <div class="ci-head"><h3 id="ciName"></h3><span id="ciRole"></span><span id="ciStatus" hidden></span></div>
          <ul id="ciSkills"></ul>
          <p id="ciPassive"></p>
          <div id="lobbyDeck"></div>
          <p id="lobbyErr" role="alert"></p>
          <div class="lobby-actions">
            <button id="lobbyDetail" class="btn btn-ghost">상세 보기</button>
            <button id="lobbyStart" class="btn btn-gold">선택</button>
          </div>
        </div>
      </div>
      <div class="lobby-foot">
        <label>배경음 <input type="range" id="volBgm" min="0" max="100"></label>
        <label>효과음 <input type="range" id="volSfx" min="0" max="100"></label>
        <button id="muteBtn" class="btn btn-ghost">음소거</button>
        <button id="lobbyTouch" class="btn btn-ghost">터치 조작 전환</button>
      </div>
    </section>

    <!-- 캐릭터 상세 (전신 그림은 여기서만) -->
    <section id="charDetail" class="screen" hidden aria-label="캐릭터 상세">
      <div class="panel detail-card">
        <div class="detail-art"><img id="detailArt" alt=""></div>
        <div class="detail-info">
          <div class="ci-head"><h3 id="detailName"></h3><span id="detailRole"></span></div>
          <ul id="detailSkills"></ul>
          <p id="detailPassive"></p>
          <button id="detailClose" class="btn btn-blue">닫기</button>
        </div>
      </div>
    </section>

    <!-- 결과 화면 -->
    <section id="results" class="screen" hidden aria-label="게임 결과">
      <div class="panel res-card">
        <div class="res-title" id="resTitle">승리!</div>
        <div class="res-body">
          <figure class="res-who"><img id="resChar" alt=""><figcaption id="resName"></figcaption></figure>
          <div class="res-stats">
            <div class="stat"><span>순위</span><b id="resRank">1위</b></div>
            <div class="stat"><span>처치</span><b id="resKills">0</b></div>
            <div class="stat"><span>입힌 피해</span><b id="resDmg">0</b></div>
            <div class="stat"><span>생존 시간</span><b id="resTime">0:00</b></div>
          </div>
        </div>
        <div class="res-btns">
          <button id="overBtn" class="btn btn-blue">다시 하기</button>
          <button id="resLobby" class="btn btn-gold">로비로</button>
        </div>
      </div>
    </section>
  </div>
  <div id="debugBar">
    <button onclick="openLobby()">캐릭터 선택 (Esc)</button>
    <button onclick="reset()">재시작</button>
    <button onclick="god=!god">무적 전환</button>
    <button onclick="freeze=!freeze">AI 정지 전환</button>
  </div>
  <div id="msg"></div>

  <!-- 순서 중요: 일반 script 들이 전역 변수를 공유합니다 (file:// 로 열어도 동작) -->
  <script src="js/data/maps/jungle.js"></script>
  <script src="js/data/combat.js"></script>
  <script src="js/data/pets.js"></script>
  <script src="js/data/characters.js"></script>
  <script src="js/data/sounds.js"></script>
  <script src="js/engine/assets.js"></script>
  <script src="js/engine/world.js"></script>
  <script src="js/engine/view.js"></script>
  <script src="js/engine/audio.js"></script>
  <script src="js/render/feel.js"></script>
  <script src="js/game/pets.js"></script>
  <script src="js/ui/deck.js"></script>
  <script src="js/game/state.js"></script>
  <script src="js/engine/input.js"></script>
  <script src="js/game/combat.js"></script>
  <script src="js/game/skills.js"></script>
  <script src="js/game/ai.js"></script>
  <script src="js/game/update.js"></script>
  <script src="js/render/effects.js"></script>
  <script src="js/render/background.js"></script>
  <script src="js/render/renderer.js"></script>
  <script src="js/ui/touch.js"></script>
  <script src="js/ui/lobby.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
