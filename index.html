<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>주엽공고 일시정지 메뉴 수정</title>
<style>body{background:#14213e;color:#edf3ff;font:16px system-ui,sans-serif;margin:0;padding:30px}main{max-width:650px;margin:auto;background:#243968;border:2px solid #769ce1;border-radius:16px;padding:28px}h1{font-size:24px;color:#ffdf7b;margin-top:0}a{color:#ffdf7b}button{background:#f4c85a;color:#322200;border:0;border-radius:9px;padding:12px 20px;font:inherit;font-weight:bold;cursor:pointer}button:disabled{opacity:.5;cursor:default}input{max-width:100%;margin:14px 0}#status{white-space:pre-wrap;color:#b8f0da;line-height:1.5}p{line-height:1.5}small{color:#cad8ee}</style>
<main><h1>주엽공고 · 일시정지 메뉴 수정</h1><p>기존 공개 빌드의 일시정지 메뉴에 모바일 터치 처리 보완만 적용합니다. 랭킹 및 캐릭터 데이터는 수정하지 않습니다.</p><p>1. <a href="https://github.com/h01020565237-a11y/game/blob/main/index.html" target="_blank" rel="noopener">현재 GitHub index.html 열기</a> → Download raw file로 원본 파일 저장.<br>2. 아래에서 원본 파일 선택.<br>3. 수정된 index.html 생성 후 GitHub main에 덮어쓰기.</p><input id="src" type="file" accept=".html,.htm,text/html"><br><button id="go" disabled>수정된 index.html 생성</button><p id="status" role="status"></p><small>원본 파일은 수정하지 않습니다. 모든 작업은 이 브라우저 안에서 처리됩니다. 패치 적용 후 실제 게임에서 메뉴 버튼 및 이어하기를 확인해 주세요.</small></main>
<script>
const src=document.getElementById('src'),go=document.getElementById('go'),status=document.getElementById('status');
src.onchange=()=>{go.disabled=!src.files.length;status.textContent=src.files.length?src.files[0].name+' ('+Math.round(src.files[0].size/1024/1024)+' MB) 선택됨':''};
function patchGame(html){
 if(html.includes('JUYEOP_PAUSE_TOUCH_FIX_V2')) throw Error('이미 수정된 파일입니다.');
 const marker='function installBattlePauseMenu() {';
 const start=html.indexOf(marker), end=html.indexOf('installBattlePauseMenu();',start);
 if(start<0||end<0)throw Error('일시정지 메뉴가 포함된 현재 배포본이 아닙니다. 최신 main의 index.html을 선택해 주세요.');
 let block=html.slice(start,end);
 const replace=(a,b)=>{if(!block.includes(a))throw Error('예상한 메뉴 코드와 달라 안전하게 수정할 수 없습니다: '+a.slice(0,85));block=block.replace(a,b)};
 replace('  mobile.onpointerdown = null;','  // JUYEOP_PAUSE_TOUCH_FIX_V2\n  mobile.onpointerdown = null;');
 replace('  pc.onclick = mobile.onclick = open;',`  // Mobile game buttons are handled on pointerdown, not delayed click.\n  mobile.onpointerdown = (e) => {\n    e.preventDefault();\n    e.stopPropagation();\n    open();\n  };\n  // Keep click fallback for keyboard and assistive activation.\n  mobile.onclick = open;\n  pc.onpointerdown = (e) => { if (e.button === 0) { e.preventDefault(); e.stopPropagation(); open(); } };\n  pc.onclick = open;`);
 replace('    body.menuOpen #skillTip { visibility:hidden; }',`    body.menuOpen #skillTip { visibility:hidden; }\n    body.mobile #touch #menuBtn { z-index:9; pointer-events:auto; touch-action:none; }\n    #battlePause { line-height:1.3; }\n    #battlePause button { touch-action:manipulation; }`);
 if(/id=["']pauseRank["']/.test(block)||block.includes('JuyeopRankingUI'))throw Error('랭킹 포함 버전입니다. 일시정지만 배포된 main 파일을 선택해 주세요.');
 // The patched function is ordinary JS, validate its syntax without running game logic.
 new Function(block);
 return html.slice(0,start)+block+html.slice(end);
}
go.onclick=async()=>{go.disabled=true;try{const html=await src.files[0].text();const patched=patchGame(html);const blob=new Blob([patched],{type:'text/html;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='index.html';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);status.textContent='수정 파일 생성 완료.\n다운로드한 index.html을 기존 main의 index.html과 교체하세요.\n원본은 보관해 주세요.'}catch(e){status.textContent='수정 실패: '+e.message}finally{go.disabled=false}};
</script></html>
